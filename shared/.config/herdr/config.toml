onboarding = false
[keys]
prefix = "ctrl+s"
focus_pane_left = ["prefix+left", "cmd+alt+left"]
focus_pane_down = ["prefix+down", "cmd+alt+down"]
focus_pane_up = ["prefix+up", "cmd+alt+up"]
focus_pane_right = ["prefix+right", "cmd+alt+right"]
split_horizontal = ["prefix+,", "cmd+shift+d"]
split_vertical = ["prefix+.", "cmd+d"]
cycle_pane_previous = ["prefix+shift+tab", "cmd+["]
cycle_pane_next = ["prefix+tab", "cmd+]"]
resize_pane_left = "cmd+ctrl+left"
resize_pane_down = "cmd+ctrl+down"
resize_pane_up = "cmd+ctrl+up"
resize_pane_right = "cmd+ctrl+right"
zoom = ["prefix+z", "cmd+shift+enter"]
close_pane = ["prefix+x", "cmd+w"]
new_tab = ["prefix+t", "cmd+t"]
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
switch_tab = ["prefix+1..9", "cmd+1..9"]
close_tab = ["prefix+x", "cmd+alt+w"]
new_workspace = ["prefix+shift+n", "cmd+n"]
previous_workspace = "cmd+shift+left"
next_workspace = "cmd+shift+right"
switch_workspace = "cmd+ctrl+1..9"
close_workspace = ["prefix+shift+d", "cmd+shift+w"]
workspace_picker = "prefix+w"
goto = "prefix+g"
copy_mode = "prefix+y"                               # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

# hunkdiff plugin (plugins/hunkdiff). prefix+shift+h is herdr's swap_pane_left, so review uses v.
# install-pager/uninstall-pager are one-time setup; run them from the command palette.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "local.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "local.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "local.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "local.hunkdiff.review:branch"
description = "hunk: review this branch against its base"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "local.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "local.hunkdiff.reload"
description = "hunk: reload the open review"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "local.hunkdiff.close-review"
description = "hunk: close the review pane"

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
[theme]
name = "kanagawa"

auto_switch = false
[ui.toast]
delivery = "herdr"
