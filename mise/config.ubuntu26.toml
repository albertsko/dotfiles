[bootstrap]
dotfile_groups = ["shared", "ssh", "ubuntu26"]

[bootstrap.linux.systemd.units.gdrive]
description = "Synchronize Google Drive files"
type = "oneshot"
exec_start = "/bin/bash -lc 'exec \"$$DOTFILES_HOME/apps/run.sh\" gdrive service'"
working_directory = "~"
timeout_stop_sec = "100s"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.gdrive-timer]
description = "Synchronize Google Drive files every five minutes"
on_boot_sec = "1min"
on_unit_inactive_sec = "5min"
unit = "gdrive"

[tasks.bootstrap]
description = "Finish Ubuntu setup that mise cannot declare"
depends = ["setup:repo", "setup:ssh", "setup:linux-casks"]
