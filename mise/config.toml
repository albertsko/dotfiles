[tools]
"github:jdx/jactionlint" = "latest"

[settings]
dotfiles.root = "~/.local/state/dotfiles"
dotfiles.relative_symlinks = true

[dotfile_groups.shared]
root = "profile-shared"
manifest = "git"

[dotfile_groups.ssh]
root = "profile-ssh"
manifest = "git"

[bootstrap.brew]
homebrew_metadata = true

[bootstrap.packages]
"brew:wget" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:gh" = "latest"
"brew:lazygit" = "latest"
"brew:btop" = "latest"
"brew:fastfetch" = "latest"
"brew:tlrc" = "latest"
"brew:bat" = "latest"
"brew:xh" = "latest"
"brew:git" = "latest"
"brew:hunk" = "latest"
"brew:rclone" = "latest"
"brew:hk" = "latest"
"brew:betterleaks" = "latest"

"brew:fish" = "latest"
"brew:mise" = "latest"
"brew:fzf" = "latest"
"brew:starship" = "latest"
"brew:zoxide" = "latest"
"brew:herdr" = "latest"

"brew:go" = "latest"
"brew:lua" = "latest"
"brew:node" = "latest"
"brew:python@3.15" = "latest"
"brew:uv" = "latest"
"brew:pnpm" = "latest"
"brew:opencode" = "latest"
"brew:pi-coding-agent" = "latest"
"brew:shellcheck" = "latest"
"brew:shfmt" = "latest"
"brew:golangci-lint" = "latest"
"brew:go-task" = "latest"
"brew:sqlc" = "latest"
"brew:goose" = "latest"

# mise bootstrap runs only a task named `bootstrap`, so a final hook runs the namespaced task.
[bootstrap.hooks.final]
run = "mise run zz-dotfiles:bootstrap"

[tasks."zz-dotfiles:bootstrap"]
description = "Finish setup that mise cannot declare"
depends = ["zz-dotfiles:setup:repo", "zz-dotfiles:setup:ssh"]
