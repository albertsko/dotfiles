[tools]
"github:jdx/jactionlint" = "latest"

[settings]
dotfiles.root = "~/.local/state/dotfiles"
dotfiles.relative_symlinks = true

[dotfile_groups.shared]
root = "profile-shared"
manifest = "git"

[dotfile_groups.ssh]
root = "profile-ssh"
manifest = "git"

[bootstrap.brew]
homebrew_metadata = true

[bootstrap.packages]
"brew:wget" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:gh" = "latest"
"brew:lazygit" = "latest"
