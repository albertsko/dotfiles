# mise installs only font casks on Linux, so the agent CLIs come from the mise registry.
[tools]
codex = "latest"
claude = "latest"

# sshd runs ~/.bashrc for `ssh host cmd`, and Ubuntu's stock file returns early for non-interactive shells.
[dotfiles]
"~/.bashrc/profile-common" = { line = '[[ -f "$HOME/.profile.common" ]] && . "$HOME/.profile.common"', position = "prepend" }
# Terminals start non-login bash, so start fish from ~/.bashrc. Skip commands, and bash started from fish.
"~/.bashrc/fish" = { block = '''
[[ -f "$HOME/.profile.local" ]] && . "$HOME/.profile.local"
[[ $- == *i* && -z "$BASH_EXECUTION_STRING" && "$(ps -o comm= -p "$PPID")" != fish ]] || return
command -v fish >/dev/null && exec fish
''' }
