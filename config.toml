min_version = "2026.10.21"

[settings]
# The bootstrap command in README.md clones the repository here.
dotfiles.root = "~/.local/state/dotfiles"
# Relative links keep the checkout and linked files portable within a home directory.
dotfiles.relative_symlinks = true

# Each group is a directory of files linked into $HOME. Profiles select groups.
[dotfile_groups.shared]
root = "shared"
manifest = "git"

[dotfile_groups.ssh]
root = "ssh"
manifest = "git"

[dotfile_groups.macos]
root = "macos"
manifest = "git"

[bootstrap]
dotfile_groups = []

[bootstrap.brew]
homebrew_metadata = true

[bootstrap.brew.taps]
"jdx/jactionlint" = "https://github.com/jdx/jactionlint.git"

[bootstrap.packages]
# CLI
"brew:wget" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:gh" = "latest"
"brew:lazygit" = "latest"
"brew:lazydocker" = "latest"
"brew:lazysql" = "latest"
"brew:btop" = "latest"
"brew:fastfetch" = "latest"
"brew:tlrc" = "latest"
"brew:bat" = "latest"
"brew:xh" = "latest"
"brew:git" = "latest"
"brew:hunk" = "latest"
"brew:rclone" = "latest"
"brew:hk" = "latest"
"brew:betterleaks" = "latest"

# Shell
"brew:fish" = "latest"
"brew:mise" = "latest"
"brew:fzf" = "latest"
"brew:starship" = "latest"
"brew:zoxide" = "latest"
"brew:herdr" = "latest"

# Containers and Kubernetes
"brew:kubernetes-cli" = "latest"
"brew:minikube" = "latest"
"brew:k9s" = "latest"
"brew:helm" = "latest"
"brew:cri-tools" = "latest"

# Coding
"brew:go" = "latest"
"brew:lua" = "latest"
"brew:node" = "latest"
"brew:python@3.15" = "latest"
"brew:uv" = "latest"
"brew:pnpm" = "latest"
"brew:opencode" = "latest"
"brew:pi-coding-agent" = "latest"
"brew:shellcheck" = "latest"
"brew:shfmt" = "latest"
"brew:golangci-lint" = "latest"
"brew:go-task" = "latest"
"brew:sqlc" = "latest"
"brew:goose" = "latest"

# These casks are shared by the macOS configuration.
"brew-cask:codex" = "latest"
"brew-cask:claude-code@latest" = "latest"
"brew-cask:jdx/jactionlint/jactionlint" = "latest"
